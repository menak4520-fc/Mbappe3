<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Team - Embabi Games</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b132b; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 2rem; }
        
        /* شريط الإحصائيات */
        .stats-bar { background: #1c2541; padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 20px; font-weight: bold; border: 1px solid #3a506b; flex-wrap: wrap; gap: 10px; }
        .coins { color: #facc15; font-size: 1.2rem; }
        .ovr { color: #4ade80; font-size: 1.2rem; }

        /* التحكم بالتكتيك والمباريات */
        .controls-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
        .match-btn { background: #10b981 !important; font-size: 1rem !important; padding: 10px 20px !important; }
        .match-btn:hover { background: #059669 !important; }

        /* الفلتر وسوق المزادات */
        .filter-container { margin: 15px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        select, input { padding: 8px 12px; border-radius: 6px; border: 1px solid #3a506b; background: #1c2541; color: white; outline: none; }
        
        .section-title { margin: 25px 0 15px; color: #94a3b8; text-align: right; border-bottom: 2px solid #1c2541; padding-bottom: 5px; }
        
        /* الملعب */
        .pitch { background: linear-gradient(135deg, #115e59, #047857); border: 3px solid #10b981; border-radius: 15px; padding: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; min-height: 200px; align-items: center; }
        
        /* شبكة سوق المزادات */
        .market-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; max-height: 500px; overflow-y: auto; padding: 10px; background: #1c2541; border-radius: 12px; }

        /* تصميم كارت EA Sports UT */
        .card { background: linear-gradient(180deg, #1e293b, #0f172a); border: 2px solid #38bdf8; border-radius: 10px; width: 110px; padding: 10px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.4); position: relative; transition: transform 0.2s; }
        .card.Legend { border-color: #facc15; background: linear-gradient(180deg, #713f12, #451a03); }
        .card.Elite { border-color: #38bdf8; background: linear-gradient(180deg, #0369a1, #0c4a6e); }
        .card.Talent { border-color: #94a3b8; background: linear-gradient(180deg, #334155, #0f172a); }
        
        .card:hover { transform: translateY(-5px); }
        .card-ovr { font-size: 1.3rem; font-weight: 900; }
        .card-name { font-size: 0.85rem; font-weight: bold; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-pos { font-size: 0.7rem; background: rgba(0,0,0,0.5); border-radius: 4px; padding: 2px 4px; display: inline-block; }
        .card-price { font-size: 0.75rem; color: #facc15; margin-top: 4px; font-weight: bold; }

        button { background: #2563eb; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 6px; width: 100%; font-size: 0.8rem; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <h1>🎮 Embabi Ultimate Team</h1>
    
    <div class="stats-bar">
        <div>الـ OVR الإجمالي: <span id="team-ovr" class="ovr">0</span></div>
        <div>الخطّة: <span id="active-formation-display" style="color: #38bdf8;">4-3-3</span></div>
        <div>الكوينز: <span id="user-coins" class="coins">5,000,000</span> 🪙</div>
    </div>

    <div class="controls-container">
        <select id="formation-select" onchange="changeFormation(this.value)">
            <option value="4-3-3">الخطة: 4-3-3</option>
            <option value="4-4-2">الخطة: 4-4-2</option>
            <option value="3-5-2">الخطة: 3-5-2</option>
        </select>
        <button class="match-btn" onclick="playMatch()">⚽ لعب مباراة (Match Simulator)</button>
    </div>

    <h2 class="section-title">⚽ تشكيلتك الحالية (Squad Builder)</h2>
    <div class="pitch" id="squad">
        <p style="color: #cbd5e1;">التشكيلة فارغة! قم بشراء لاعبين من سوق المزادات بالأسفل.</p>
    </div>

    <h2 class="section-title">🛒 سوق المزادات (Auction Market)</h2>
    
    <div class="filter-container">
        <input type="text" id="search-input" placeholder="ابحث عن لاعب..." oninput="renderMarket()">
        <select id="pos-filter" onchange="renderMarket()">
            <option value="ALL">كل المراكز</option>
            <option value="GK">GK</option>
            <option value="CB">CB</option>
            <option value="RB">RB</option>
            <option value="LB">LB</option>
            <option value="CDM">CDM</option>
            <option value="CM">CM/CAM</option>
            <option value="RW">RW</option>
            <option value="LW">LW</option>
            <option value="CF">CF</option>
            <option value="ST">ST</option>
        </select>
    </div>

    <div class="market-grid" id="market"></div>

    <!-- 1. استدعاء قاعدة البيانات أولاً -->
    <script src="js/players.js"></script>

    <!-- 2. ملف التحكم الرئيسي -->
    <script src="js/ultimate_team.js"></script>
</body>
</html>
